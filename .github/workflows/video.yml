# Crea il video d'arrivo di una tappa (generatore social di Virtua Cycling).
# Il motore sta in un repository PRIVATO: qui c'e' solo questo workflow.
# I log di questo repository sono pubblici: il generatore stampa solo tappa, categoria, esito e tempi.
name: Video arrivo

on:
  workflow_dispatch:
    inputs:
      tappa:
        description: id_stage della tappa
        required: true
      fotofinish:
        description: arrivo al fotofinish (mai inventato)
        type: boolean
        default: false
      risoluzione:
        description: risoluzione del video
        type: choice
        options: ['1080', '720']
        default: '1080'
      asset:
        description: 'tutti = scarica tutto il repo (come oggi); su_misura = solo il codice, poi i soli asset che il video usa'
        type: choice
        options: ['tutti', 'su_misura']
        default: 'tutti'
      processi:
        description: 'Processi della frontale (vuoto = tutti i core; per le prove di velocita)'
        type: string
        default: ''
  repository_dispatch:
    types: [genera_video]

concurrency:
  group: video-${{ github.event.inputs.tappa || github.event.client_payload.tappa }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Motore (repository privato, tutto)
        if: (github.event.inputs.asset || github.event.client_payload.asset) != 'su_misura'
        uses: actions/checkout@v4
        with:
          repository: Jericho1987/virtua-cycling-video
          ref: master
          token: ${{ secrets.VIDEO_REPO_TOKEN }}
          persist-credentials: false

      - name: Motore (repository privato, solo codice, asset su misura dopo)
        if: (github.event.inputs.asset || github.event.client_payload.asset) == 'su_misura'
        uses: actions/checkout@v4
        with:
          repository: Jericho1987/virtua-cycling-video
          ref: master
          token: ${{ secrets.VIDEO_REPO_TOKEN }}
          persist-credentials: true     # serve per scaricare i blob degli asset quando la scena e' pronta (si toglie a fine job)
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/asset/
            !/giro27_fonti/
            !/giro28_fonti/
            /asset/*.json
            /asset/*.png

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 'Ambiente in cache (librerie Python, ffmpeg, teste), un solo ripristino invece di tre'
        id: amb
        uses: actions/cache@v4
        with:
          path: |
            ~/venv
            ~/ffbin
            cache_teste
          key: ambiente-${{ runner.os }}-py312-ff7.0.2-${{ hashFiles('requirements-runner.txt', 'generatore/teste_generiche.json') }}

      - name: ffmpeg (scaricato solo se non e' in cache)
        if: steps.amb.outputs.cache-hit != 'true'
        id: ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        continue-on-error: true
        with:
          github-token: ${{ github.token }}

      - name: ffmpeg nel PATH (e copia dei binari per la cache)
        run: |
          mkdir -p ~/ffbin
          if [[ ! -x ~/ffbin/ffmpeg ]] && command -v ffmpeg > /dev/null; then
            cp "$(command -v ffmpeg)" ~/ffbin/
            command -v ffprobe > /dev/null && cp "$(command -v ffprobe)" ~/ffbin/
          fi
          if [[ -x ~/ffbin/ffmpeg ]]; then echo "$HOME/ffbin" >> "$GITHUB_PATH"; else rm -rf ~/ffbin; fi

      - name: Strumenti
        run: |
          command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }   # ripiego se il passo veloce fallisce
          [[ -x ~/venv/bin/python ]] || { python -m venv ~/venv && ~/venv/bin/pip install -q -r requirements-runner.txt; }

      - name: Versione delle figure
        id: ver
        run: echo "v=$(grep -m1 -oE '^VERSIONE *= *[0-9]+' motore/personaggi.py | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"

      - name: Figure dei corridori (ripristino)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: corridori-${{ steps.ver.outputs.v }}-${{ github.run_id }}
          restore-keys: corridori-${{ steps.ver.outputs.v }}-

      - name: Elenco delle figure prima del video
        id: fig_prima
        run: echo "h=$(find cache -type f 2>/dev/null | sort | sha1sum | cut -c1-20)" >> "$GITHUB_OUTPUT"

      - name: Video
        env:
          TAPPA: ${{ github.event.inputs.tappa || github.event.client_payload.tappa }}
          FOTOFINISH: ${{ github.event.inputs.fotofinish || github.event.client_payload.fotofinish }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VC_TESTE: ${{ github.workspace }}/cache_teste
          VC_SS: ${{ (github.event.inputs.risoluzione || github.event.client_payload.risoluzione) == '720' && '0.6667' || '1' }}
          PROCESSI: ${{ github.event.inputs.processi }}
          VC_ASSET: ${{ (github.event.inputs.asset || github.event.client_payload.asset) == 'su_misura' && 'su_misura' || '' }}
        run: |
          if [[ -n "$PROCESSI" ]]; then [[ "$PROCESSI" =~ ^[1-9][0-9]*$ ]] || { echo "processi non validi"; exit 1; }; export VC_PROCESSI="$PROCESSI"; fi
          [[ "$TAPPA" =~ ^[0-9]+$ ]] || { echo "tappa non valida"; exit 1; }
          FF=""; [[ "$FOTOFINISH" == "true" ]] && FF="--fotofinish"
          VC_PY=~/venv/bin/python ~/venv/bin/python -I generatore/esegui.py --tappa "$TAPPA" $FF

      - name: Elenco delle figure dopo il video
        id: fig_dopo
        run: echo "h=$(find cache -type f 2>/dev/null | sort | sha1sum | cut -c1-20)" >> "$GITHUB_OUTPUT"

      - name: Figure dei corridori (salvataggio solo se sono cambiate)
        if: steps.fig_dopo.outputs.h != steps.fig_prima.outputs.h
        uses: actions/cache/save@v4
        with:
          path: cache
          key: corridori-${{ steps.ver.outputs.v }}-${{ github.run_id }}
